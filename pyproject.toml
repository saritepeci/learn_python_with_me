[tool.poetry]
name = "learn-python"
version = "0.1.0"
description = "A comprehensive Python learning reference guide"
authors = ["Bekir Saritepeci"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
tabulate = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
robotframework = "^7.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [".", "src"]

tabulate = "^0.9.0"
